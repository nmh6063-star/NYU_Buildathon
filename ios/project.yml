name: Droplet

options:
  bundleIdPrefix: com.droplet
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.4
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm
    exactVersion: 7.2.3

targets:
  Droplet:
    type: application
    platform: iOS
    sources:
      - path: Droplet
    configFiles:
      Debug: Droplet/Resources/Config.xcconfig
      Release: Droplet/Resources/Config.xcconfig
    info:
      path: Droplet/Resources/Info.plist
      properties:
        CFBundleDisplayName: Droplet
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droplet.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
      - package: LinkKit
        product: LinkKit
    scheme:
      testTargets:
        - DropletTests

  DropletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DropletTests
    dependencies:
      - target: Droplet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.droplet.app.tests
        GENERATE_INFOPLIST_FILE: YES
